name: Voice chat APK (arm64)
run-name: Voice chat APK · ${{ github.sha }}

# Builds Horizon Android with the voice chat mod compiled in (native-mods/voicechat), for arm64-v8a.
# Run it by hand: Actions > Voice chat APK (arm64) > Run workflow. The APK is the artifact of the run.
# It installs beside the normal Horizon (package dev.horizon.android.dev). It is signed with the fixed key
# packaging/android/voicechat-signing.bin, so each new build installs over the previous one as an update.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'
      - name: Install Android toolchain
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          rustup target add aarch64-linux-android
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/horizon-native
            .local/ci-target
          key: voicechat-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            voicechat-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-
      - name: Fetch Opus
        run: packaging/android/fetch_opus.sh
      - name: Apply the voice chat mod to the source
        run: packaging/android/voicechat_apply.sh
      - name: Prepare private engine inputs from official downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Use the fixed signing key
        run: |
          mkdir -p .local/android
          cp packaging/android/voicechat-signing.bin .local/android/debug.keystore
      - name: Build arm64 APK
        run: |
          python3 tools/android_build.py --abi arm64-v8a --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "${JAVA_HOME_17_X64:-$JAVA_HOME}" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "voicechat.${GITHUB_RUN_NUMBER}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Collect the APK
        run: |
          mkdir dist
          cp .local/android/apk/arm64-v8a/horizon-android-public.apk "dist/Horizon-Android-voicechat.${GITHUB_RUN_NUMBER}-arm64-v8a.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-voicechat-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing key
        if: always()
        run: rm -f .local/android/ci.keystore .local/android/debug.keystore
