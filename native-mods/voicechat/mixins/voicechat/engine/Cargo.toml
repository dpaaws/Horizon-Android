[package]
name = "voicechat-engine"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "An unofficial Simple Voice Chat protocol client for Horizon: protocol, Opus and audio"
publish = false
build = "build.rs"

# Only crates in Horizon's Cargo.lock, by version requirement.
[dependencies]
libloading = "0.8"
ring = "0.17"

# Computers: the sound card through cpal, Opus from the system's libopus.
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.16"

# Android: AAudio (libaaudio.so, loaded at run time) and an Opus compiled in from opus/ (build.rs).
[build-dependencies]
cc = "1"
